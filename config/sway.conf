font pango:DejaVu Sans 11
default_border pixel 2
focus_follows_mouse yes

output HEADLESS-1 mode 1280x800@60Hz bg #18212f solid_color

set $mod Mod4
set $term foot
set $browser chromium --user-data-dir=/run/chromium-game --ozone-platform=wayland --disable-gpu --disable-dev-shm-usage --no-sandbox --no-first-run --no-default-browser-check --disable-background-networking --disable-component-update --disable-sync --disable-extensions --app=http://127.0.0.1:8080

bindsym $mod+Return exec $term
bindsym $mod+b exec $browser
bindsym $mod+Shift+q kill
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit the Wayland desktop?' -b 'Exit' 'swaymsg exit'

exec waybar
exec $browser

bar {
    mode invisible
}
