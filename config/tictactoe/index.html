<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alpine Tic-Tac-Toe</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #09101d;
      color: #f7f9fc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1524;
    }

    main {
      width: min(94vw, 500px);
      padding: 24px;
      border: 1px solid #30445f;
      border-radius: 22px;
      background: #101c2d;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      color: #8fd8c5;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #35e6a8;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 5px 0 16px;
      color: #a9bad0;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .score {
      padding: 8px;
      border: 1px solid #263a54;
      border-radius: 10px;
      color: #9fb0c7;
      text-align: center;
      font-size: 12px;
    }

    .score strong {
      display: block;
      margin-top: 1px;
      color: #fff;
      font-size: 19px;
    }

    #status {
      min-height: 25px;
      margin-bottom: 11px;
      color: #d8e4f4;
      text-align: center;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      width: min(100%, 354px);
      margin: 0 auto;
    }

    .cell {
      aspect-ratio: 1;
      border: 1px solid #38506e;
      border-radius: 16px;
      background: #111e31;
      color: #fff;
      font: inherit;
      font-size: clamp(42px, 10vw, 68px);
      font-weight: 900;
      cursor: pointer;
    }

    .cell:hover:empty,
    .cell:focus-visible:empty {
      border-color: #72b7ff;
      background: #172b46;
      outline: none;
    }

    .cell.x { color: #78baff; }
    .cell.o { color: #49e2ac; }
    .cell.win { background: #193d3b; border-color: #49e2ac; }

    #reset {
      width: 100%;
      margin-top: 15px;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: #e9f2ff;
      color: #0b1627;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
    }

    #reset:hover { background: #fff; }

    footer {
      margin-top: 12px;
      color: #71849d;
      text-align: center;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot"></span>Live inside Alpine</div>
    <h1>Tic-Tac-Toe</h1>
    <p class="subtitle">You are X. The Firecracker VM plays O.</p>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score">You<strong id="human-score">0</strong></div>
      <div class="score">Draws<strong id="draw-score">0</strong></div>
      <div class="score">Alpine<strong id="alpine-score">0</strong></div>
    </section>

    <div id="status" role="status" aria-live="polite">Your turn — choose a square.</div>
    <div class="board" role="grid" aria-label="Tic-tac-toe board">
      <button class="cell" data-cell="0" aria-label="Top left"></button>
      <button class="cell" data-cell="1" aria-label="Top center"></button>
      <button class="cell" data-cell="2" aria-label="Top right"></button>
      <button class="cell" data-cell="3" aria-label="Middle left"></button>
      <button class="cell" data-cell="4" aria-label="Middle center"></button>
      <button class="cell" data-cell="5" aria-label="Middle right"></button>
      <button class="cell" data-cell="6" aria-label="Bottom left"></button>
      <button class="cell" data-cell="7" aria-label="Bottom center"></button>
      <button class="cell" data-cell="8" aria-label="Bottom right"></button>
    </div>

    <button id="reset" type="button">New round</button>
    <footer>BusyBox HTTP · 127.0.0.1:8080 · no external dependencies</footer>
  </main>

  <script>
    const cells = [...document.querySelectorAll('.cell')];
    const status = document.querySelector('#status');
    const lines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];
    const score = { X: 0, O: 0, draw: 0 };
    let board = Array(9).fill('');
    let active = true;
    let waiting = false;

    function evaluate(state) {
      for (const line of lines) {
        const [a, b, c] = line;
        if (state[a] && state[a] === state[b] && state[a] === state[c]) {
          return { result: state[a], line };
        }
      }
      return state.every(Boolean) ? { result: 'draw', line: [] } : null;
    }

    function minimax(state, alpineTurn, depth) {
      const outcome = evaluate(state);
      if (outcome) {
        if (outcome.result === 'O') return 10 - depth;
        if (outcome.result === 'X') return depth - 10;
        return 0;
      }

      let best = alpineTurn ? -Infinity : Infinity;
      for (let i = 0; i < state.length; i += 1) {
        if (state[i]) continue;
        state[i] = alpineTurn ? 'O' : 'X';
        const value = minimax(state, !alpineTurn, depth + 1);
        state[i] = '';
        best = alpineTurn ? Math.max(best, value) : Math.min(best, value);
      }
      return best;
    }

    function alpineMove() {
      let bestValue = -Infinity;
      let choice = -1;
      for (let i = 0; i < board.length; i += 1) {
        if (board[i]) continue;
        board[i] = 'O';
        const value = minimax(board, false, 0);
        board[i] = '';
        if (value > bestValue) {
          bestValue = value;
          choice = i;
        }
      }
      return choice;
    }

    function paint() {
      cells.forEach((cell, index) => {
        cell.textContent = board[index];
        cell.classList.toggle('x', board[index] === 'X');
        cell.classList.toggle('o', board[index] === 'O');
      });
    }

    function finish(outcome) {
      active = false;
      waiting = false;
      score[outcome.result] += 1;
      document.querySelector('#human-score').textContent = score.X;
      document.querySelector('#alpine-score').textContent = score.O;
      document.querySelector('#draw-score').textContent = score.draw;
      outcome.line.forEach(index => cells[index].classList.add('win'));
      status.textContent = outcome.result === 'X'
        ? 'You won! Nicely played.'
        : outcome.result === 'O'
          ? 'Alpine wins this round.'
          : 'Draw — the board is full.';
    }

    function play(index) {
      if (!active || waiting || board[index]) return;
      board[index] = 'X';
      paint();
      let outcome = evaluate(board);
      if (outcome) return finish(outcome);

      waiting = true;
      status.textContent = 'Alpine is thinking…';
      window.setTimeout(() => {
        const choice = alpineMove();
        if (choice >= 0) board[choice] = 'O';
        paint();
        outcome = evaluate(board);
        if (outcome) return finish(outcome);
        waiting = false;
        status.textContent = 'Your turn — choose a square.';
      }, 260);
    }

    function reset() {
      board = Array(9).fill('');
      active = true;
      waiting = false;
      cells.forEach(cell => cell.classList.remove('win', 'x', 'o'));
      paint();
      status.textContent = 'Your turn — choose a square.';
    }

    cells.forEach((cell, index) => cell.addEventListener('click', () => play(index)));
    document.querySelector('#reset').addEventListener('click', reset);
  </script>
</body>
</html>
